name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: unzip -o *.zip
      - run: mvn -f SmpPlugin/pom.xml clean package
      - uses: actions/upload-artifact@v4
        with:
          name: SmpPlugin-jar
          path: SmpPlugin/target/SmpPlugin-*.jar
